<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألعاب ثنائية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eaf0f6;--ink:#17283d;--card:#fff;--line:#c6d3e1;--x:#d9482b;--o:#14808a;--mut:#5d6f84}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
main{max-width:460px;margin:0 auto;padding:24px 16px}
h1{font-size:2rem;font-weight:800;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 24px}
label{display:block;font-weight:600;margin:16px 0 6px}
input{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{font:inherit;text-align:right;padding:16px;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer}
.game b{display:block;font-size:1.3rem}
.game span{color:var(--mut);font-size:.9rem}
.game:disabled{border-style:dashed;border-color:var(--line);cursor:default;opacity:.7}
.row{display:flex;gap:8px}
.btn{font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
#err{color:var(--x);min-height:1.5em;margin:12px 0 0}
.hidden{display:none!important}
select{width:100%;font:inherit;padding:11px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.top{flex-wrap:wrap}.top .row{flex-wrap:wrap}.top .btn{padding:8px 12px;font-size:.9rem}
#offline{background:#fff3b0;border:2px solid var(--x);border-radius:10px;padding:8px 12px;font-weight:600}#meta{margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.chip{font-weight:800;letter-spacing:.25em;font-size:1.4rem;background:var(--ink);color:#fff;padding:4px 14px;border-radius:8px}
.wait{text-align:center;padding:32px 8px}
.wait p{color:var(--mut)}
.score{display:flex;justify-content:space-between;gap:8px}
.x{color:var(--x)}.o{color:var(--o)}
.msg{text-align:center;font-size:1.4rem;font-weight:800;margin:16px 0;padding:8px;border-radius:10px}
.msg.mine{background:var(--ink);color:#fff}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{aspect-ratio:1;font:800 clamp(2.5rem,16vw,4rem)/1 Cairo,sans-serif;border:2px solid var(--ink);border-radius:14px;background:var(--card);cursor:pointer}
.cell:disabled{cursor:default}
.cell.x{color:var(--x)}.cell.o{color:var(--o)}
.cell.win{background:#fff3b0}
#game .btn{display:block;margin:20px auto 0}
</style>
</head>
<body>
<div id="diag" class="hidden" style="background:#fff3b0;border-bottom:2px solid #d9482b;padding:10px 14px;font-size:.9rem;white-space:pre-line"></div>
<script>
// شريط تشخيص: يظهر فقط إذا فشل تحميل ملفات اللعبة أو حدث خطأ
(function () {
  var d = document.getElementById("diag");
  function show(t) { d.classList.remove("hidden"); d.textContent += t + "\n"; }
  window.addEventListener("error", function (e) { show("خطأ: " + (e.message || "فشل تحميل ملف")); }, true);
  window.addEventListener("unhandledrejection", function (e) { show("خطأ: " + (e.reason && (e.reason.message || e.reason))); });
  setTimeout(async function () {
    if (window.__ok) return;
    show("لم يتم تحميل كود اللعبة. فحص الملفات:");
    for (var f of ["js/rooms.js", "js/games/xo.js"]) {
      try { var r = await fetch(f); show(f + " : " + (r.ok ? "موجود" : "غير موجود (" + r.status + ")")); }
      catch (e) { show(f + " : تعذر الفحص"); }
    }
  }, 3000);
})();
</script>
<main>
  <section id="home">
    <h1>ألعاب ثنائية</h1>
    <p class="sub">العب مع صديقك برابط واحد، بدون حساب.</p>
    <label for="name">اسمك</label>
    <input id="name" maxlength="14" placeholder="مثال: يونس" autocomplete="off">
    <label>اختر لعبة وأنشئ غرفة</label>
    <div class="games">
      <button class="game" data-game="xo"><b>XO</b><span>إنشاء غرفة</span></button>
      <button class="game" data-game="color"><b>تحدي الألوان</b><span>30 ثانية، الأكثر صح يفوز</span></button>
      <button class="game" data-game="sudoku" data-mode="race"><b>سودوكو سباق</b><span>من يكمل أولًا</span></button>
      <button class="game" data-game="sudoku" data-mode="shared"><b>سودوكو مشتركة</b><span>نفس اللوحة بالنقاط</span></button>
      <button class="game" data-game="numberRush"><b>تجميع الأرقام</b><span>سباق الأرقام السريع (1-16)</span></button>
      <button class="game" data-game="balloonRace"><b>صراع البالونات</b><span>فجّر بالوناتك المخصصة بأسرع وقت</span></button>
      <button class="game" data-game="migration"><b>هجرة الطيور</b><span>تحدي التركيز والانتباه السريع</span></button>
    </div>
    <label for="diff">صعوبة السودوكو</label>
    <select id="diff"><option value="easy">سهل</option><option value="medium" selected>متوسط</option><option value="hard">صعب</option></select>
    <label for="join">أو انضم بكود صديقك (إن كانت الغرفة ممتلئة تدخل كمشاهد)</label>
    <div class="row">
      <input id="join" maxlength="4" placeholder="ABCD" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em">
      <button class="btn" id="joinBtn">انضم</button>
    </div>
    <p id="err" role="alert"></p>
  </section>

  <section id="room" class="hidden">
    <div class="top">
      <span class="chip" id="code"></span>
      <div class="row">
        <button class="btn ghost" id="copy">نسخ الرابط</button>
        <button class="btn ghost" id="wa">واتساب</button>
        <button class="btn ghost" id="snd">🔊</button>
        <button class="btn ghost" id="leave">خروج</button>
      </div>
    </div>
    <p id="offline" class="hidden" role="status"></p>
    <p id="meta" class="sub"></p>
    <div id="wait" class="wait hidden">
      <h2>في انتظار صديقك…</h2>
      <p>أرسل له الكود أو اضغط «نسخ الرابط» وأرسله له.</p>
    </div>
    <div id="game"></div>
  </section>
</main>

<script type="module">
import * as R from "./js/rooms.js";
import xo from "./js/games/xo.js";
import sudoku from "./js/games/sudoku.js";
import color from "./js/games/color-game.js";
import numberRush from "./js/games/number-rush.js";
import balloonRace from "./js/games/balloon-game.js";
import migration from "./js/games/migration.js";
  
const G = { xo, sudoku, color, numberRush, balloonRace, migration };
const $ = (s) => document.querySelector(s);
const nameEl = $("#name"), errEl = $("#err");
let code = null, unsub = null, unPres = null, prev = "", touched = 0, ac = null;

nameEl.value = localStorage.getItem("name") || "";
const myName = () => {
  const n = nameEl.value.trim().slice(0, 14) || "لاعب";
  localStorage.setItem("name", n);
  return n;
};
const show = (id) => { $("#home").classList.toggle("hidden", id !== "home"); $("#room").classList.toggle("hidden", id !== "room"); };

function enter(c) {
  code = c;
  errEl.textContent = "";
  history.replaceState(null, "", "?room=" + c);
  $("#code").textContent = c;
  show("room");
  unsub = R.watch(c, render);
  unPres = R.present(c, myName());
}

function leave(msg) {
  if (unsub) unsub();
  if (unPres) unPres();
  unsub = unPres = null; code = null; prev = "";
  history.replaceState(null, "", location.pathname);
  show("home");
  errEl.textContent = msg || "";
}

function render(r) {
  if (!r) return leave("هذه الغرفة لم تعد موجودة");
  const waiting = !r.guest;
  $("#wait").classList.toggle("hidden", !waiting);
  $("#game").classList.toggle("hidden", waiting);
  const me = R.role(code), op = me === "host" ? "guest" : "host", on = r.online || {};
  const w = Object.values(r.spectators || {});
  $("#meta").textContent = (me === "spec" ? "أنت تشاهد المباراة. " : "") + (w.length ? `👁 ${w.length} يشاهدون: ${w.map((x) => x.name).join("، ")}` : "");
  const gone = me !== "spec" && r.guest && on[me] && !on[op];
  $("#offline").classList.toggle("hidden", !gone);
  if (gone) $("#offline").textContent = `${r[op].name} غير متصل حاليًا…`;
  if (!waiting) {
    const sig = JSON.stringify(r.state);
    if (prev && sig !== prev && Date.now() - touched > 700) ping(); // تغيير من الطرف الآخر
    prev = sig;
    G[r.game].render($("#game"), r, me, { patch: (o) => R.patch(code, o) });
  }
}

async function create(game, mode) {
  try { enter(await R.createRoom(game, myName(), G[game].init(mode, $("#diff").value))); }
  catch (e) { errEl.textContent = "تعذّر إنشاء الغرفة: " + (e.code || e.message); }
}

async function join(c) {
  c = c.trim().toUpperCase();
  if (c.length !== 4) { errEl.textContent = "الكود مكوّن من 4 حروف"; return; }
  try { await R.joinRoom(c, myName()); enter(c); }
  catch (e) {
    errEl.textContent = e.message === "notfound" ? "لا توجد غرفة بهذا الكود"
      : e.message === "full" ? "الغرفة ممتلئة" : "تعذّر الانضمام. تأكد من الاتصال.";
  }
}

document.querySelectorAll(".game[data-game]").forEach((b) => b.onclick = () => create(b.dataset.game, b.dataset.mode));
$("#joinBtn").onclick = () => join($("#join").value);
$("#join").onkeydown = (e) => e.key === "Enter" && join(e.target.value);
$("#leave").onclick = async () => {
  const c = code;
  if (unsub) unsub();
  if (unPres) unPres();
  unsub = unPres = null;
  try { await R.leaveRoom(c); } catch (e) {}
  leave();
};
$("#wa").onclick = () => window.open("https://wa.me/?text=" + encodeURIComponent("تعال نلعب معي! " + location.origin + location.pathname + "?room=" + code), "_blank");
$("#copy").onclick = async (e) => {
  try { await navigator.clipboard.writeText(location.origin + location.pathname + "?room=" + code); e.target.textContent = "تم النسخ"; }
  catch { e.target.textContent = "انسخ من شريط العنوان"; }
  setTimeout(() => (e.target.textContent = "نسخ الرابط"), 2000);
};

// صوت واهتزاز عند حركة الطرف الآخر
function ping() {
  if (localStorage.getItem("mute")) return;
  if (navigator.vibrate) navigator.vibrate(40);
  try { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; g.gain.value = 0.08; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.12); } catch (e) {}
}
["pointerdown", "keydown"].forEach((t) => document.addEventListener(t, () => {
  touched = Date.now();
  try { ac = ac || new AudioContext(); if (ac.state === "suspended") ac.resume(); } catch (e) {}
}, true));
const snd = $("#snd"), updSnd = () => (snd.textContent = localStorage.getItem("mute") ? "🔇" : "🔊");
snd.onclick = () => { localStorage.getItem("mute") ? localStorage.removeItem("mute") : localStorage.setItem("mute", "1"); updSnd(); };
updSnd();

window.__ok = true;

// فتح رابط غرفة: العودة مباشرة إن كنت فيها، أو تجهيز خانة الكود للانضمام
const p = (new URLSearchParams(location.search).get("room") || "").toUpperCase();
if (p) {
  if (R.role(p)) enter(p);
  else { $("#join").value = p; errEl.textContent = "أدخل اسمك ثم اضغط «انضم»"; }
}
</script>
</body>
</html>
